[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "godot-localization-audit"
version = "0.1.0"
description = "Read-only Godot localization audits and reviewable translation patches"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Hidden Measure Interactive"}]
dependencies = []
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Software Development :: Internationalization"]

[project.scripts]
godot-localization-audit = "godot_localization_audit.__main__:main"

[tool.setuptools.packages.find]
include = ["godot_localization_audit*"]
